name: Mobile layout check

on:
  # PRs get one run; main is re-checked after each merge (pushing a PR branch no longer runs it twice)
  push:
    branches: [main]
  pull_request:

jobs:
  mobile:
    # Pinned: Playwright 1.49's WebKit needs Ubuntu 24.04 system libraries (ubuntu-latest moved past it)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run check:mobile
      - name: Upload phone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screenshots
          path: mobile-check-results/
